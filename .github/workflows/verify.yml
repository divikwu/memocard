name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @memocard/ui exec playwright install --with-deps chromium
      - run: pnpm verify:design
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version
      - name: Check Simulator readiness
        run: python3 apps/apple/Tests/run-surface-subscriptions.py --device auto --prepare-only
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - name: Verify generated Xcode project
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- apps/apple/MemoCard.xcodeproj/project.pbxproj
      - name: Verify Web, contracts and native core
        run: pnpm verify
      - name: Test local service
        run: pnpm test:service
      - name: Test native sidebar index
        run: pnpm test:sidebar-native
      - name: Test native surfaces in Simulator
        run: pnpm test:native-surfaces
      - name: Build macOS app
        run: pnpm build:mac
        env:
          MEMOCARD_USE_PREBUILT_UI: '1'
      - name: Build iOS app
        run: pnpm build:ios
        env:
          MEMOCARD_USE_PREBUILT_UI: '1'
      - name: Build local service
        run: pnpm build:service
        env:
          MEMOCARD_USE_PREBUILT_UI: '1'
      - name: Verify service signature
        run: codesign --verify --deep --strict build/local-service/MemoCardService.app
