name: Diagnose browser release checks
on:
  push:
    branches: [codex/stabilize-browser-release-tests]

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: firefox
            file: test-support/ui-quality.browser.tsx
            title: Web detail aligns title
          - engine: webkit
            file: test-support/interface-themes.browser.tsx
            title: real editor menus and property confirmation
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @memocard/ui exec playwright install ${{ matrix.engine }}
      - run: pnpm --filter @memocard/ui exec vitest run --config vitest.storybook.config.ts --project "ui-quality (${{ matrix.engine }})" '${{ matrix.file }}' -t '${{ matrix.title }}'
