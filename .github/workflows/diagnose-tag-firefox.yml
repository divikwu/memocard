name: Diagnose tag directory Firefox test
on:
  push:
    branches: [codex/refine-web-theme-interactions]

jobs:
  tag-directory-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @memocard/ui exec playwright install firefox
      - run: pnpm --filter @memocard/ui exec vitest run --config vitest.storybook.config.ts --project 'ui-quality (firefox)' test-support/ui-quality.browser.tsx -t 'Web tag groups save shared|Web tag directory supports flat labels'
        env:
          DEBUG: pw:api
